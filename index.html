<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Baby Daily</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F59E23" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Baby Daily" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#FFF8E1; --bg2:#FFF1CC; --card:#FFFFFF; --ink:#4A3A1A; --muted:#9A845A;
    --line:#F0E2BC; --amber:#F59E23; --amberDeep:#E0820A; --amberSoft:#FFEDC7;
    --green:#3F9E5A; --greenSoft:#E4F3E4; --red:#D6453C; --redSoft:#FBE3E0;
    --sky:#5AA9D6; --skySoft:#E1F0F8;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(130% 90% at 50% -10%, #FFF6D6 0%, #FFF8E1 55%);
    background-attachment:fixed;
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 72px);
  }
  .wrap{max-width:780px;margin:0 auto;padding:clamp(14px,4vw,32px);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .title{font-size:clamp(26px,6vw,34px);font-weight:600;}
  .sub{color:var(--muted);font-size:14px;margin-top:2px;font-weight:600;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px -12px rgba(224,130,10,0.35);}
  .card h2{font-size:19px;margin-bottom:4px;}
  .card .note{color:var(--muted);font-size:13px;line-height:1.5;margin:2px 0 12px;font-weight:600;}

  .age-hero{background:linear-gradient(135deg,#FFD36B,#F59E23);color:#4A3A1A;border:none;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 10px 26px -12px rgba(224,130,10,0.6);}
  .age-hero .big{font-family:'Fraunces',serif;font-size:clamp(26px,6vw,32px);font-weight:600;line-height:1.1;}
  .age-hero .stage{font-size:14px;font-weight:700;margin-top:6px;opacity:0.85;}

  .pill{display:inline-block;background:var(--amberSoft);color:var(--amberDeep);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:0 6px 6px 0;}
  .row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .k{font-weight:700;font-size:14px;min-width:96px;}
  .row .v{font-size:14px;color:var(--ink);line-height:1.5;font-weight:600;}

  /* checklist */
  .check{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .check:last-child{border-bottom:none;}
  .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--amber);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .box.on{background:var(--amber);border-color:var(--amber);}
  .box.on::after{content:"✓";color:#fff;font-weight:800;font-size:15px;}
  .check .lbl{font-size:15px;font-weight:600;line-height:1.4;}
  .check.done .lbl{color:var(--muted);text-decoration:line-through;}

  /* red flags */
  .flag{background:var(--redSoft);border:1px solid #F3C9C4;border-radius:14px;padding:14px 16px;}
  .flag h2{color:var(--red);}
  .flag ul{margin:8px 0 0;padding-left:20px;}
  .flag li{font-size:14px;line-height:1.6;margin-bottom:6px;font-weight:700;color:#8A2820;}
  .emerg{background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;margin-top:12px;line-height:1.5;}

  /* trackers */
  .track-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px;}
  .tbtn{border:none;border-radius:12px;padding:12px 8px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;color:#4A3A1A;}
  .tbtn.feed{background:#FFE1A8;} .tbtn.wet{background:#D7ECF7;} .tbtn.dirty{background:#E6DAC0;} .tbtn.sleep{background:#E2D6F2;}
  .log{max-height:220px;overflow:auto;}
  .logrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;}
  .logrow .del{color:var(--muted);font-size:12px;cursor:pointer;padding:2px 8px;border:1px solid var(--line);border-radius:6px;font-weight:700;}
  .counts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .cbadge{font-size:13px;font-weight:800;color:var(--amberDeep);background:var(--amberSoft);border-radius:10px;padding:6px 10px;}

  /* tabs */
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20;}
  .tab{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--muted);background:none;border:none;padding:6px 2px;cursor:pointer;font-family:inherit;}
  .tab.active{color:var(--amberDeep);}
  .tab .ic{font-size:20px;display:block;margin-bottom:2px;}

  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
  .btn-primary{background:var(--amber);color:#fff;box-shadow:0 6px 16px -8px var(--amberDeep);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  input[type=date],input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-family:inherit;color:var(--ink);font-weight:600;}
  label{font-size:14px;font-weight:700;display:block;margin-bottom:6px;}

  /* sync status */
  .syncbar{font-size:12px;font-weight:800;border-radius:10px;padding:7px 11px;margin-bottom:12px;background:var(--amberSoft);color:var(--amberDeep);}
  .syncbar.ok{background:var(--greenSoft);color:#2C7A43;}
  .syncbar.err{background:var(--redSoft);color:#8A2820;}
  .syncbar.off{background:#EFEAE0;color:var(--muted);}

  /* feed amount picker */
  .ozgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .ozbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 4px;
    font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;}
  .ozbtn.whole{background:var(--amberSoft);color:var(--amberDeep);border-color:transparent;font-size:20px;}
  .ozbtn:active{transform:scale(0.96);}

  /* age tracker */
  .agegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;}
  .agecell{background:var(--amberSoft);border-radius:14px;padding:12px 6px;text-align:center;}
  .agenum{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--amberDeep);line-height:1;}
  .ageunit{font-size:12px;font-weight:800;color:var(--amberDeep);margin-top:3px;text-transform:uppercase;letter-spacing:0.3px;}
  .agesub{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;}

  .swatch{width:34px;height:34px;border-radius:10px;flex-shrink:0;border:1px solid rgba(0,0,0,0.15);}

  /* history */
  .ranges{display:flex;gap:8px;margin-bottom:12px;}
  .range{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:800;font-family:inherit;color:var(--muted);cursor:pointer;}
  .range.on{background:var(--amber);color:#fff;border-color:var(--amber);}
  .hrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
  .hrow:last-child{border-bottom:none;}
  .hday{font-size:14px;font-weight:800;}
  .hsub{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .hnums{font-size:13px;font-weight:800;color:var(--amberDeep);white-space:nowrap;align-self:center;}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;}
  .stat:last-child{border-bottom:none;}
  .stat b{font-family:'Fraunces',serif;font-size:17px;}

  .disc{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px;font-weight:600;}
  #boot{padding:40px 24px;color:var(--muted);font-weight:700;}
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div id="boot">Loading…</div></div></div>
<div class="tabs" id="tabs"></div>

<script>
(function(){
  "use strict";
  var K_BIRTH="baby_birth_v1", K_CHECK="baby_check_v1", K_LOG="baby_log_v1";
  var K_KEY="baby_key_v1", K_DEL="baby_del_v1", K_NAME="baby_name_v1", K_SEX="baby_sex_v1";
  var K_HEALTH="baby_health_v1", K_SCHED="baby_sched_v1";

  // ---- your worker ----
  var WORKER_URL="https://baby-log.mattfitzpatrick1994.workers.dev";

  function get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
  function set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
  function getJSON(k,f){ try{var s=localStorage.getItem(k);return s?JSON.parse(s):f;}catch(e){return f;} }
  function setJSON(k,v){ set(k,JSON.stringify(v)); }

  function pad(n){ return n<10?"0"+n:""+n; }
  function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }

  function uid(){
    return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
  }

  // ---------- vaccine schedules ----------
  // Two schedules, picked in settings. Ages are the routine windows; what
  // actually gets given is whatever your clinic administers on the day, which
  // is why every item is a manual tick with a date rather than auto-completing.
  var SCHEDULES={
    aap:{
      name:"US — AAP 2026",
      note:"American Academy of Pediatrics 2026 schedule. Since January 2026 the CDC schedule differs from this one on several vaccines — your pediatrician will tell you which they follow.",
      visits:[
        {age:0,   label:"Birth",      items:["HepB — dose 1 (within 24 hrs)"]},
        {age:30,  label:"1 month",    items:["HepB — dose 2 (1–2 months)"]},
        {age:61,  label:"2 months",   items:["DTaP — 1","Hib — 1","PCV — 1","IPV (polio) — 1","Rotavirus — 1"]},
        {age:122, label:"4 months",   items:["DTaP — 2","Hib — 2","PCV — 2","IPV (polio) — 2","Rotavirus — 2"]},
        {age:183, label:"6 months",   items:["DTaP — 3","Hib — 3 (if brand needs it)","PCV — 3","IPV (polio) — 3 (6–18 mo)","Rotavirus — 3 (if brand needs it)","HepB — dose 3 (6–18 mo)","COVID-19 — series from 6 mo","Influenza — yearly from 6 mo"]},
        {age:274, label:"9 months",   items:["Check-up — catch up on anything missed"]},
        {age:365, label:"12 months",  items:["MMR — 1 (12–15 mo)","Varicella — 1 (12–15 mo)","HepA — 1 (12–23 mo)","PCV — 4 (12–15 mo)","Hib — booster (12–15 mo)"]},
        {age:456, label:"15 months",  items:["DTaP — 4 (15–18 mo)"]},
        {age:548, label:"18 months",  items:["HepA — 2 (6 mo after dose 1)"]},
        {age:1461,label:"4–6 years",  items:["DTaP — 5","IPV (polio) — 4","MMR — 2","Varicella — 2"]}
      ],
      seasonal:["RSV — nirsevimab or clesrovimab, one dose in RSV season (Oct–Mar) if mum didn't have the RSV vaccine in pregnancy, or had it under 14 days before birth","Influenza — yearly from 6 months"]
    },
    uk:{
      name:"UK — NHS",
      note:"The NHS routine childhood schedule. Useful if you're registering with a GP in the UK or travelling back.",
      visits:[
        {age:61,  label:"8 weeks",    items:["6-in-1 (DTaP/IPV/Hib/HepB) — 1","Rotavirus — 1","MenB — 1"]},
        {age:92,  label:"12 weeks",   items:["6-in-1 — 2","Rotavirus — 2","Pneumococcal (PCV) — 1"]},
        {age:122, label:"16 weeks",   items:["6-in-1 — 3","MenB — 2"]},
        {age:365, label:"1 year",     items:["Hib/MenC","MMR — 1","Pneumococcal (PCV) — 2","MenB — 3"]},
        {age:1186,label:"3 yrs 4 mo", items:["4-in-1 pre-school booster","MMR — 2"]}
      ],
      seasonal:["Children's flu vaccine — yearly nasal spray from 2 years","Vitamin D drops — daily from birth if breastfed or having under 500ml formula a day"]
    }
  };
  function schedKey(){ var s=get(K_SCHED); return (s==="uk"||s==="aap")?s:"aap"; }
  function sched(){ return SCHEDULES[schedKey()]; }

  // ---------- health records ----------
  // { vax:{ "<schedule>|<visit>|<item>": {on,at,date} }, growth:[...], temps:[...] }
  function healthState(){
    var h=getJSON(K_HEALTH,null);
    if(!h||typeof h!=="object") h={};
    if(!h.vax) h.vax={};
    if(!h.miles) h.miles={};
    if(!Array.isArray(h.growth)) h.growth=[];
    if(!Array.isArray(h.temps)) h.temps=[];
    return h;
  }
  function saveHealth(h){ setJSON(K_HEALTH,h); push(); }

  function lbOz(kg){
    if(!kg) return "";
    var total=kg*2.20462;
    var lb=Math.floor(total);
    var oz=Math.round((total-lb)*16);
    if(oz===16){ lb++; oz=0; }
    return lb+"lb "+oz+"oz";
  }
  function inches(cm){ return cm? (cm/2.54).toFixed(1)+'"' : ""; }
  function toF(c){ return (c*9/5+32); }

  // Under 3 months this is an emergency, and it stays a red flag after that.
  var FEVER_C=38.0;
  function feverLevel(c){
    if(c>=FEVER_C) return "fever";
    if(c<=36.0) return "low";
    return "ok";
  }
  // Everything user-facing goes through these, so the app reads naturally
  // whether a name is set or not, and whether or not you know the sex yet.
  // ---------- name & pronouns ----------
  function babyName(){ var n=get(K_NAME); return n&&n.trim()?n.trim():""; }
  // Subject of a sentence: "Alfie is 3 weeks old" / "Baby is 3 weeks old"
  function Baby(){ return babyName()||"Baby"; }
  // Mid-sentence: "how long Alfie had been awake" / "how long baby had been awake"
  function baby(){ return babyName()||"baby"; }
  // Possessive: "Alfie's cues" / "baby's cues"
  function babys(){
    var n=babyName();
    if(!n) return "baby's";
    return n+(/s$/i.test(n)?"'":"'s");
  }
  function Babys(){
    var n=babyName();
    if(!n) return "Baby's";
    return n+(/s$/i.test(n)?"'":"'s");
  }
  var PRONOUNS={
    girl:{they:"she",them:"her",their:"her",theyre:"she's",theyve:"she's",s:"s"},
    boy: {they:"he", them:"him",their:"his",theyre:"he's", theyve:"he's", s:"s"},
    "":  {they:"they",them:"them",their:"their",theyre:"they're",theyve:"they've",s:""}
  };
  function P(){ return PRONOUNS[get(K_SEX)||""]||PRONOUNS[""]; }
  // "she stops" vs "they stop" - verb agreement follows the pronoun
  function vs(verb){ return verb+P().s; }

  // Format from the stored timestamp rather than the saved label, so entries
  // logged before this change display in 12-hour time too.
  function clock(ms){
    return new Date(ms).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
  }

  // ---------- sync ----------
  var SYNC={state:"idle",msg:""};

  function secret(){ return get(K_KEY)||""; }
  function syncOn(){ return !!secret() && WORKER_URL.indexOf("PASTE_")<0; }

  // Older entries were written before ids and used unpadded day keys.
  // Repair them once so merging and sorting behave.
  function migrate(){
    var log=getJSON(K_LOG,[]), dirty=false;
    log.forEach(function(e){
      if(!e.id){ e.id=uid(); dirty=true; }
      if(e.day && e.day.length<10 && e.t){ e.day=keyOf(new Date(e.t)); dirty=true; }
    });
    if(dirty) setJSON(K_LOG,log);

    var store=getJSON(K_CHECK,{}), cdirty=false, out={};
    Object.keys(store).forEach(function(day){
      var nd=day;
      if(day.length<10){
        var p=day.split("-");
        if(p.length===3){ nd=p[0]+"-"+pad(+p[1])+"-"+pad(+p[2]); cdirty=true; }
      }
      var src=store[day], dst=out[nd]||{};
      Object.keys(src).forEach(function(k){
        var v=src[k];
        // old format was a plain boolean; new format carries a timestamp
        if(typeof v==="boolean"){ v={on:v,at:Date.now()}; cdirty=true; }
        dst[k]=v;
      });
      out[nd]=dst;
    });
    if(cdirty) setJSON(K_CHECK,out);
  }

  function localState(){
    return { events:getJSON(K_LOG,[]), checks:getJSON(K_CHECK,{}), deleted:getJSON(K_DEL,[]), health:healthState() };
  }
  function saveState(s){
    setJSON(K_LOG,s.events||[]);
    setJSON(K_CHECK,s.checks||{});
    setJSON(K_DEL,s.deleted||[]);
    if(s.health) setJSON(K_HEALTH,s.health);
  }

  function push(cb){
    if(!syncOn()){ if(cb)cb(); return; }
    SYNC.state="syncing"; paintSync();
    fetch(WORKER_URL+"/log",{
      method:"POST",
      headers:{"content-type":"application/json","x-baby-key":secret()},
      body:JSON.stringify(localState())
    }).then(function(r){
      if(r.status===401) throw new Error("Wrong passcode");
      if(!r.ok) throw new Error("Sync failed");
      return r.json();
    }).then(function(s){
      saveState(s); SYNC.state="ok"; SYNC.msg=""; paintSync(); if(cb)cb();
    }).catch(function(e){
      SYNC.state="err"; SYNC.msg=e.message; paintSync(); if(cb)cb();
    });
  }

  function pull(cb){
    if(!syncOn()){ if(cb)cb(); return; }
    SYNC.state="syncing"; paintSync();
    fetch(WORKER_URL+"/log",{headers:{"x-baby-key":secret()}})
      .then(function(r){
        if(r.status===401) throw new Error("Wrong passcode");
        if(!r.ok) throw new Error("Sync failed");
        return r.json();
      }).then(function(remote){
        // anything logged locally while offline still needs to go up,
        // including a nap this phone ended while the server still has it open
        var local=localState();
        var rmap={}; (remote.events||[]).forEach(function(e){rmap[e.id]=e;});
        var unsent=(local.events||[]).filter(function(e){
          var r=rmap[e.id];
          if(!r) return true;
          return !!(e.end && !r.end);
        });
        saveState(remote);
        if(unsent.length){
          // merge the unsent local versions back in before pushing
          var merged=(remote.events||[]).slice();
          var mmap={}; merged.forEach(function(e,i){mmap[e.id]=i;});
          unsent.forEach(function(e){
            if(mmap[e.id]!==undefined) merged[mmap[e.id]]=e; else merged.push(e);
          });
          setJSON(K_LOG,merged);
          push(cb); return;
        }
        SYNC.state="ok"; SYNC.msg=""; paintSync(); if(cb)cb();
      }).catch(function(e){
        SYNC.state="err"; SYNC.msg=e.message; paintSync(); if(cb)cb();
      });
  }

  function paintSync(){
    var el=document.getElementById("syncbar"); if(!el) return;
    if(!syncOn()){ el.textContent="📴 This phone only — not syncing"; el.className="syncbar off"; return; }
    if(SYNC.state==="syncing"){ el.textContent="⏳ Syncing…"; el.className="syncbar"; }
    else if(SYNC.state==="err"){ el.textContent="⚠️ "+(SYNC.msg||"Offline")+" — saved on this phone"; el.className="syncbar err"; }
    else { el.textContent="✅ Synced with your partner's phone"; el.className="syncbar ok"; }
  }
  function ageDays(birth){ var b=new Date(birth); var now=new Date(); b.setHours(0,0,0,0); var t=new Date(); t.setHours(0,0,0,0); return Math.floor((t-b)/86400000); }
  // Calendar-accurate breakdown: months and years count actual calendar
  // months, so "2 months" means the same date two months on, not 61 days.
  function ageParts(birth){
    var b=new Date(birth+"T00:00:00");
    var t=new Date(); t.setHours(0,0,0,0);
    var days=Math.floor((t-b)/86400000);

    // whole calendar months elapsed
    var months=(t.getFullYear()-b.getFullYear())*12+(t.getMonth()-b.getMonth());
    if(t.getDate()<b.getDate()) months--;
    if(months<0) months=0;

    // days since that monthly anniversary. A birth day that doesn't exist in
    // the target month (31st -> February) is clamped to that month's last day,
    // otherwise JS rolls it into the following month and the count goes wrong.
    function annivFor(monthsOn){
      var y=b.getFullYear(), mo=b.getMonth()+monthsOn;
      var lastDay=new Date(y, mo+1, 0).getDate();
      return new Date(y, mo, Math.min(b.getDate(), lastDay));
    }
    var anniv=annivFor(months);
    if(anniv>t) anniv=annivFor(months-1);
    var daysIntoMonth=Math.max(0,Math.floor((t-anniv)/86400000));

    var years=Math.floor(months/12);
    var monthsIntoYear=months%12;
    var daysToNextMonth=Math.max(0,Math.ceil((annivFor(months+1)-t)/86400000));

    return {
      days: days,
      weeks: Math.floor(days/7),
      daysIntoWeek: days%7,
      months: months,
      daysIntoMonth: daysIntoMonth,
      daysToNextMonth: daysToNextMonth,
      years: years,
      monthsIntoYear: monthsIntoYear,
      nextBirthday: new Date(b.getFullYear()+years+1, b.getMonth(), b.getDate())
    };
  }

  function plural(n,word){ return n+" "+word+(n===1?"":"s"); }

  function ageText(days){
    if(days<0) return "not born yet";
    if(days===0) return "born today 🎉";
    var w=Math.floor(days/7), d=days%7;
    if(days<7) return days+(days===1?" day old":" days old");
    if(days<70){ var s=w+(w===1?" week":" weeks"); if(d) s+=", "+d+(d===1?" day":" days"); return s+" old"; }
    var m=Math.floor(days/30.44); return m+(m===1?" month":" months")+" old";
  }

  // ---------- age-based guidance ----------
  function stageOf(days){
    if(days<7) return "week1";
    if(days<28) return "weeks2to4";
    if(days<56) return "weeks5to8";
    if(days<84) return "weeks9to12";
    return "months3plus";
  }
  function guidance(days){
    var st=stageOf(days);
    var feed = days<28
      ? "Every 2–3 hours, 8–12 times a day, day and night. Follow hunger cues; wake "+P().them+" to feed if 3+ hrs have passed in the day."
      : "Roughly every 2.5–3.5 hours, ~7–9 feeds a day. Longer night stretches may start to appear.";
    var wake = days<28
      ? "35–60 minutes awake between sleeps — very short. Watch for sleepy cues and settle "+P().them+" early."
      : days<84
        ? "60–90 minutes awake between sleeps."
        : "About 75–120 minutes awake between sleeps.";
    var sleep = days<84
      ? "14–17 hrs total across the day in short bursts. No fixed schedule yet — that comes around 3–4 months."
      : "14–16 hrs total; day/night rhythm starts becoming clearer.";
    var nappies = days<7
      ? "Wet: builds from 1 on day 1 to 6+ by day 6. Dirty: stools change from black (meconium) → green → yellow & seedy."
      : "6+ wet nappies a day, and regular soft yellow stools (breastfed babies can vary a lot — that's normal).";
    var focus = {
      week1: ["Umbilical cord: keep clean & dry, fold nappy below it", "Feed on demand, wake to feed if sleepy", "Back to sleep, firm flat surface, nothing in the cot", "Track wet/dirty nappies to confirm feeding is working", "First pediatrician visit is usually 3–5 days old"],
      weeks2to4: [Baby()+" should be back to birth weight by ~2 weeks", "Cord stump usually falls off 1–3 weeks", "Tummy time: a few minutes, a few times a day, while awake & watched", "Day/night confusion is normal now"],
      weeks5to8: ["First real smiles may appear ✨", "Longer alert periods — gentle play, talking, contrast pictures", "2-month check-up & first vaccines usually due", "Cluster feeding & evening fussiness can peak"],
      weeks9to12: ["More cooing and 'talking' back", "Starting to hold head steadier during tummy time", "Naps may start consolidating a little"],
      months3plus: ["Clearer day/night rhythm forming", "Rolling may start — never leave on a raised surface", "More interactive: laughing, reaching for things"]
    };
    return {feed:feed,wake:wake,sleep:sleep,nappies:nappies,focus:focus[st]};
  }

  // Volumes are entered and shown in fl oz but stored in ml, so the numbers
  // stay exact if the unit ever changes and totals never drift on rounding.
  var ML_PER_OZ=29.5735;
  function toOz(ml){ return ml/ML_PER_OZ; }
  function ozText(ml){
    if(!ml) return "";
    var oz=toOz(ml);
    // Show one decimal whenever there's a fraction, so a tapped 11.5oz never
    // displays as 11oz. Whole numbers stay clean.
    var r=Math.round(oz*10)/10;
    return (r%1===0 ? r.toFixed(0) : r.toFixed(1)) + "oz";
  }

  function durText(ms){
    if(ms==null) return "";
    var mins=Math.round(ms/60000);
    if(mins<1) return "under a minute";
    if(mins<60) return mins+"m";
    var h=Math.floor(mins/60), m=mins%60;
    return h+"h"+(m?" "+m+"m":"");
  }

  var POO_COLOURS=[
    ["black","Black / dark green","#2E2A26","Meconium — normal in the first few days."],
    ["green","Green","#4E7A3A","Common, especially early on or with formula. Usually fine."],
    ["yellow","Yellow / seedy","#E0A828","The typical milk-fed colour. Nothing to do."],
    ["brown","Brown / tan","#8A6234","Normal, more common with formula."],
    ["orange","Orange","#D2762A","Usually normal."],
    ["red","Red / blood","#C0392B","Call your doctor."],
    ["white","White / chalky / pale","#E8E4DA","Call your doctor."]
  ];
  function pooInfo(key){
    for(var i=0;i<POO_COLOURS.length;i++){ if(POO_COLOURS[i][0]===key) return POO_COLOURS[i]; }
    return null;
  }
  // Only these two need acting on; the rest are variations of normal.
  function pooConcerning(key){ return key==="red"||key==="white"; }

  // The last completed sleep before a given moment, used for wake windows.
  function awakeSince(log, before){
    var best=null;
    log.forEach(function(e){
      if(e.type!=="sleep") return;
      var end=e.end||null;
      if(end==null||end>before) return;
      if(!best||end>best) best=end;
    });
    return best;
  }

  function openSleep(log){
    for(var i=log.length-1;i>=0;i--){ if(log[i].type==="sleep"&&!log[i].end) return log[i]; }
    return null;
  }

  function renderTrackers(){
    app.innerHTML="";
    var h=document.createElement("div"); h.className="age-hero";
    h.innerHTML='<div class="stage">TRACKERS · '+new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</div><div class="big">'+Babys()+' day</div>';

    var log=getJSON(K_LOG,[]); var tkey=todayKey();
    var todayLog=log.filter(function(e){return e.day===tkey;});
    var napping=openSleep(log);

    // counts
    var counts={feed:0,wet:0,dirty:0,sleep:0};
    todayLog.forEach(function(e){ counts[e.type]=(counts[e.type]||0)+1; });
    var mlToday=0, sleepMs=0;
    todayLog.forEach(function(e){
      if(e.ml) mlToday+=e.ml;
      if(e.type==="sleep"&&e.end) sleepMs+=(e.end-e.t);
    });

    // live wake window
    if(!napping){
      var since=awakeSince(log, Date.now());
      if(since){
        var wb=document.createElement("div"); wb.className="syncbar";
        wb.textContent="⏱️ Awake "+durText(Date.now()-since)+" — last woke at "+clock(since);
        app.appendChild(wb);
      }
    } else {
      var nb=document.createElement("div"); nb.className="syncbar ok";
      nb.textContent="😴 Asleep "+durText(Date.now()-napping.t)+" — went down at "+clock(napping.t);
      app.appendChild(nb);
    }

    var c=document.createElement("div"); c.className="card";
    c.innerHTML='<h2>Quick add</h2><p class="note">One tap logs it with the current time.</p>';
    var cb=document.createElement("div"); cb.className="counts";

      (mlToday?'<span class="cbadge">🥛 '+ozText(mlToday)+'</span>':'')+
      '<span class="cbadge">💧 '+counts.wet+' wet</span><span class="cbadge">💩 '+counts.dirty+' dirty</span>'+
      '<span class="cbadge">😴 '+counts.sleep+' sleeps'+(sleepMs?' · '+durText(sleepMs):'')+'</span>';
    c.appendChild(cb);

    function addEntry(extra){
      var now=new Date();
      var entry={id:uid(),day:tkey,t:now.getTime(),label:clock(now.getTime())};
      for(var k in extra){ if(extra.hasOwnProperty(k)) entry[k]=extra[k]; }

    var grid=document.createElement("div"); grid.className="track-btns";

    grid.appendChild(fb);

    // wet

    wb2.onclick=function(){ addEntry({type:"wet"}); };
    grid.appendChild(wb2);

    // dirty - asks colour
    var db=document.createElement("button"); db.className="tbtn dirty"; db.textContent="💩 Dirty";
    db.onclick=function(){ askPoo(function(colour){ addEntry(colour?{type:"dirty",colour:colour}:{type:"dirty"}); }); };
    grid.appendChild(db);

    // sleep - start or end
    var slb=document.createElement("button"); slb.className="tbtn sleep";
    slb.textContent = napping ? "☀️ Woke up" : "😴 Asleep";
    slb.onclick=function(){
      if(napping){
        napping.end=Date.now();
        // a nap that crosses midnight still belongs to the day it started
        setJSON(K_LOG,log); renderTrackers(); push();
      } else {
        addEntry({type:"sleep"});
      }
    };
    grid.appendChild(slb);

    c.appendChild(grid);
    app.appendChild(c);

    var lc=document.createElement("div"); lc.className="card";
    lc.innerHTML='<h2>Today\'s entries</h2><p class="note">Each row shows how long '+baby()+' had been awake beforehand.</p>';
    if(!todayLog.length){ var e0=document.createElement("p"); e0.className="note"; e0.textContent="Nothing logged yet today. Tap a button above to start."; lc.appendChild(e0); }
    else{
      var wrap=document.createElement("div"); wrap.className="log";
      var icons={feed:"🍼 Feed",wet:"💧 Wet nappy",dirty:"💩 Dirty nappy",sleep:"😴 Sleep"};
      todayLog.slice().sort(function(a,b){return b.t-a.t;}).forEach(function(e){
        var r=document.createElement("div"); r.className="logrow";
        var left=document.createElement("div");

        var main=icons[e.type]+" · "+(e.t?clock(e.t):e.label);
        if(e.ml) main+="  ·  "+ozText(e.ml);
        if(e.type==="sleep"){
          main += e.end ? "  →  "+clock(e.end)+"  ·  "+durText(e.end-e.t) : "  ·  still asleep";
        }

        var bits=[];
        if(e.colour){
          var pi=pooInfo(e.colour);
          if(pi) bits.push(pi[1]);
        }
        var woke=awakeSince(log, e.t);
        if(woke && e.t>woke) bits.push("awake "+durText(e.t-woke));

        left.innerHTML='<div>'+main+'</div>'+
          (bits.length?'<div class="hsub">'+bits.join(" · ")+'</div>':'');

        var del=document.createElement("span"); del.className="del"; del.textContent="remove";
        del.onclick=function(){ var i=log.indexOf(e); if(i>=0){ log.splice(i,1); setJSON(K_LOG,log);
          var d=getJSON(K_DEL,[]); if(e.id){ d.push(e.id); setJSON(K_DEL,d); }
          renderTrackers(); push(); } };
        r.appendChild(left); r.appendChild(del); wrap.appendChild(r);
      });
      lc.appendChild(wrap);
    }
    app.appendChild(lc);
    disclaimer();
  }

  // Tappable amount picker — easier one-handed at 3am than typing a number.
  function askFeed(done){
    app.innerHTML="";

        b.textContent=(oz%1===0?oz:oz.toFixed(1));

      })(oz);

    var unit=document.createElement("p"); unit.className="note"; unit.style.textAlign="center"; unit.style.marginTop="10px";
    unit.textContent="fl oz";

    skip.textContent="Breastfed / don't record";
    skip.onclick=function(){ done(null); };

    var byDay={};
    log.forEach(function(e){
      if(!byDay[e.day]) byDay[e.day]={feed:0,wet:0,dirty:0,sleep:0,ml:0,sleepMs:0,longest:0};

      if(e.type==="sleep"&&e.end){
        var d=e.end-e.t;

    // averages
    var tot={feed:0,wet:0,dirty:0,sleep:0,ml:0,sleepMs:0}, activeDays=0, mlDays=0, sleepDays=0, longest=0;
    days.forEach(function(k){
      var c=byDay[k]; if(!c) return;

      tot.feed+=c.feed; tot.wet+=c.wet; tot.dirty+=c.dirty; tot.sleep+=c.sleep;
      tot.ml+=(c.ml||0); tot.sleepMs+=(c.sleepMs||0);

     ["💩 Dirty nappies a day",avg(tot.dirty)],["😴 Sleeps logged a day",avg(tot.sleep)]];

      var logged=c.feed||c.wet||c.dirty||c.sleep;

      var right=document.createElement("div"); right.className="hnums";

  function download(text,mime,filename){
    var blob=new Blob([text],{type:mime+";charset=utf-8;"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); },2000);
  }

  // Two sheets in one file would need a real spreadsheet format, so the CSV
  // gives the per-event rows plus a daily summary block underneath.
  function buildCSV(){
    var names={feed:"Feed",wet:"Wet nappy",dirty:"Dirty nappy",sleep:"Sleep"};
    var log=getJSON(K_LOG,[]).slice().sort(function(a,b){return (a.t||0)-(b.t||0);});
    var birth=get(K_BIRTH);

    function esc(v){
      v=(v===undefined||v===null)?"":String(v);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }
    function row(arr){ return arr.map(esc).join(","); }

    var lines=[];
    lines.push(row(["Date","Time","Type","Amount (fl oz)","Poo colour","Slept until","Sleep length","Awake before","Age (days)"]));

    var byDay={};
    log.forEach(function(e){
      var age = birth ? Math.floor((new Date(e.day+"T00:00:00") - new Date(birth))/86400000) : "";
      var pi = e.colour ? pooInfo(e.colour) : null;
      var woke = awakeSince(log, e.t);
      lines.push(row([
        e.day,
        e.t?clock(e.t):(e.label||""),
        names[e.type]||e.type,
        e.ml ? toOz(e.ml).toFixed(1) : "",
        pi ? pi[1] : "",
        (e.type==="sleep"&&e.end) ? clock(e.end) : "",
        (e.type==="sleep"&&e.end) ? durText(e.end-e.t) : "",
        (woke && e.t>woke) ? durText(e.t-woke) : "",
        age
      ]));
      if(!byDay[e.day]) byDay[e.day]={feed:0,wet:0,dirty:0,sleep:0,ml:0,sleepMs:0,longest:0};
      if(byDay[e.day][e.type]!==undefined) byDay[e.day][e.type]++;
      if(e.ml) byDay[e.day].ml+=e.ml;
      if(e.type==="sleep"&&e.end){
        var dur=e.end-e.t;
        byDay[e.day].sleepMs+=dur;
        if(dur>byDay[e.day].longest) byDay[e.day].longest=dur;
      }
    });

    lines.push("");
    lines.push(row(["Daily totals"]));
    lines.push(row(["Date","Feeds","Total fl oz","Wet nappies","Dirty nappies","Sleeps","Total sleep","Longest sleep"]));
    Object.keys(byDay).sort().forEach(function(d){
      var c=byDay[d];
      lines.push(row([d,c.feed,c.ml?toOz(c.ml).toFixed(1):"",c.wet,c.dirty,c.sleep,
        c.sleepMs?durText(c.sleepMs):"", c.longest?durText(c.longest):""]));
    });

    // Excel on Mac needs the BOM to read accented characters correctly
    return "\ufeff"+lines.join("\r\n");
  }

    MILESTONES.forEach(function(g){
      // show the current stage and everything before it, plus a peek at what's next
      var isCurrent = days>=g.age && days<g.age+120;
      var isPast = days>=g.age+120;
      var isNext = days<g.age && days>g.age-90;
      if(!isCurrent && !isPast && !isNext) return;

      var c=document.createElement("div"); c.className="card";
      var tag = isCurrent ? '<span class="pill">around now</span>' : isNext ? '<span class="pill">coming up</span>' : '';
      c.innerHTML='<h2>'+g.label+' '+tag+'</h2>';

      g.items.forEach(function(it){
        var k=g.label+"|"+it[0];
        var rec=H.miles[k]||{};
        var r=document.createElement("div"); r.className="check"+(rec.on?" done":"");
        var bx=document.createElement("div"); bx.className="box"+(rec.on?" on":"");
        var lb=document.createElement("div");
        lb.innerHTML='<div class="lbl">'+it[0]+'</div>'+
          (rec.on&&rec.date?'<div class="hsub">first seen '+rec.date+'</div>'
            : it[1]?'<div class="hsub">'+it[1]+'</div>':'');
        r.appendChild(bx); r.appendChild(lb);
        r.onclick=function(){
          if(rec.on){ delete H.miles[k]; }
          else {
            var d=prompt("When did you first see this? (YYYY-MM-DD)\n\nLeave blank for today.", todayKey());
            if(d===null) return;
            H.miles[k]={on:true,at:Date.now(),date:(d.trim()||todayKey())};
          }
          saveHealth(H); renderMilestones();
        };
        c.appendChild(r);
      });
      app.appendChild(c);
    });

    // concerns relevant to their age, plus a little either side
    var rel=DEV_CONCERNS.filter(function(x){
      if(x[0]==="Any age") return true;
      var m=x[0].match(/(\d+)\s*(week|month)/);
      if(!m) return true;
      var byDays = m[2]==="week" ? +m[1]*7 : +m[1]*30.44;
      return days >= byDays-30;
    });
    if(rel.length){
      var fc=document.createElement("div"); fc.className="card flag";
      fc.innerHTML='<h2>Worth mentioning</h2><p class="note" style="color:#8A2820">Not emergencies — but bring these up at your next check-up rather than waiting and worrying.</p>';
      var ul=document.createElement("ul");
      rel.forEach(function(x){
        var li=document.createElement("li"); li.textContent=x[0]+": "+x[1]; ul.appendChild(li);
      });
      fc.appendChild(ul);
      app.appendChild(fc);
    }

    disclaimer();
  }

  function renderFlags(){
    app.innerHTML="";
    var c=document.createElement("div"); c.className="card flag";
    c.innerHTML='<h2>Call the doctor if…</h2><p class="note" style="color:#8A2820">These are signs to get medical help. When in doubt, always call — you can\'t be too careful with a newborn.</p>';
    var ul=document.createElement("ul");
    RED_FLAGS.forEach(function(f){ var li=document.createElement("li"); li.textContent=f; ul.appendChild(li); });
    c.appendChild(ul);
    var em=document.createElement("div"); em.className="emerg";
    em.textContent="A fever of 100.4°F (38°C) or higher in a baby under 3 months is a medical emergency — call your pediatrician or go to the ER straight away. Don't give fever medicine first.";
    c.appendChild(em);
    app.appendChild(c);

    var t=document.createElement("div"); t.className="card";
    t.innerHTML='<h2>Keep handy</h2><p class="note">Save your key numbers in your phone now, so they\'re ready if you ever need them: your pediatrician, the maternity/labour ward, and your local emergency number.</p>';
    app.appendChild(t);
    disclaimer();
  }

  function disclaimer(){
    var d=document.createElement("div"); d.className="disc";
    d.textContent="General information only — not medical advice, diagnosis, or a substitute for your pediatrician. Babies vary; these are typical ranges, not rules. For anything about "+babys()+" health, or whenever you're worried, contact your doctor or emergency services.";
    app.appendChild(d);
    var reset=document.createElement("div"); reset.style.marginTop="10px";
    reset.style.display="flex"; reset.style.gap="8px"; reset.style.flexWrap="wrap";
    var b=document.createElement("button"); b.className="btn btn-ghost"; b.textContent="Change birth date";
    b.onclick=function(){ if(confirm("Change "+babys()+" date of birth?")){ localStorage.removeItem(K_BIRTH); render(); } };
    reset.appendChild(b);
    var nb=document.createElement("button"); nb.className="btn btn-ghost"; nb.textContent="Name & pronouns";
    nb.onclick=function(){
      var n=prompt("Baby's name\n\nLeave blank to just say \u201Cbaby\u201D.", get(K_NAME)||"");
      if(n!==null){ n=n.trim(); if(n) set(K_NAME,n); else localStorage.removeItem(K_NAME); }
      var cur=get(K_SEX)||"";
      var sxLabel = cur==="girl"?"girl":cur==="boy"?"boy":"not saying";
      var sx=prompt("Boy or girl? Type: boy, girl, or leave blank for \u201Cthey\u201D.\n\nCurrently: "+sxLabel, cur);
      if(sx!==null){
        sx=sx.trim().toLowerCase();
        if(sx==="boy"||sx==="b"||sx==="m"||sx==="male") set(K_SEX,"boy");
        else if(sx==="girl"||sx==="g"||sx==="f"||sx==="female") set(K_SEX,"girl");
        else localStorage.removeItem(K_SEX);
      }
      render();
    };
    reset.appendChild(nb);
    var kb=document.createElement("button"); kb.className="btn btn-ghost"; kb.textContent="Sharing passcode";
    kb.onclick=function(){
      var v=prompt("Sharing passcode — the same on both phones. Leave blank for this phone only.", get(K_KEY)||"");
      if(v===null) return;
      v=v.trim(); if(v) set(K_KEY,v); else localStorage.removeItem(K_KEY);
      pull(function(){ render(); });
    };
    reset.appendChild(kb);
    app.appendChild(reset);
  }

  var TABS=[["today","🏠","Today"],["track","📝","Track"],["history","📊","History"],["health","❤️","Health"],["flags","🚨","Doctor"]];
  function renderTabs(){
    var t=document.getElementById("tabs"); t.innerHTML="";
    if(needsBirth()){ t.style.display="none"; return; } t.style.display="flex";
    TABS.forEach(function(tb){
      var b=document.createElement("button"); b.className="tab"+(TAB===tb[0]?" active":"");
      b.innerHTML='<span class="ic">'+tb[1]+'</span>'+tb[2];
      b.onclick=function(){ TAB=tb[0]; renderTabs(); render(); };
      t.appendChild(b);
    });
  }

  function render(){
    if(needsBirth()){ renderSetup(); renderTabs(); return; }
    if(TAB==="today") renderToday();
    else if(TAB==="schedule") renderSchedule();
    else if(TAB==="track") renderTrackers();
    else if(TAB==="history") renderHistory();
    else if(TAB==="health") renderHealth();
    else if(TAB==="milestones") renderMilestones();
    else if(TAB==="flags") renderFlags();
    window.scrollTo(0,0);
  }

  // pull again when the app comes back to the foreground, so the phone in
  // your pocket catches up with whatever was logged while it was closed
  var lastPull=0;
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible") return;
    if(Date.now()-lastPull<15000) return;
    lastPull=Date.now();
    pull(function(){ if(TAB==="track"||TAB==="history"||TAB==="today") render(); });
  });

  try{
    migrate();
    renderTabs(); render();
    lastPull=Date.now();
    pull(function(){ render(); });
  }
  catch(err){ document.getElementById("boot").textContent="Something went wrong: "+err.message; }
})();
</script>
</body>
</html>
